[package]
name = "kdev"
version = "0.1.0"
description = "KDev portable development environment"
authors = ["KAGIMU DALTON"]
edition = "2021"

[lib]
name = "kdev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
