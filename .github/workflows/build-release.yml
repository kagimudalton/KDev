name: KDev Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix installed workspace paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceRoot = @'
  let home = std::env::var_os("USERPROFILE").map(PathBuf::from).ok_or_else(|| "USERPROFILE is unavailable".to_string())?;
  let root = home.join("Documents").join("KDev");
  fs::create_dir_all(&root).map_err(|e| format!("cannot create KDev workspace: {e}"))?;
  Ok(root)
'@
          $lib = Get-Content -Raw src-tauri/src/lib.rs
          $oldLib = @'
fn kdev_root() -> Result<PathBuf, String> {
    let exe = std::env::current_exe().map_err(|e| format!("cannot locate KDev executable: {e}"))?;
    exe.parent().map(Path::to_path_buf).ok_or_else(|| "cannot determine KDev root".into())
}
'@
          $newLib = "fn kdev_root() -> Result<PathBuf, String> {`n$workspaceRoot`n}`n"
          if (-not $lib.Contains($oldLib)) { throw 'Expected lib.rs installed-root function was not found.' }
          $lib = $lib.Replace($oldLib, $newLib)
          Set-Content -NoNewline -Encoding utf8 src-tauri/src/lib.rs $lib

          $project = Get-Content -Raw src-tauri/src/project_tools.rs
          $oldProject = @'
fn root() -> Result<PathBuf, String> {
    std::env::current_exe().map_err(|e| e.to_string())?.parent().map(|p| p.to_path_buf()).ok_or_else(|| "cannot locate KDev root".into())
}
'@
          $newProject = "fn root() -> Result<PathBuf, String> {`n  let home = std::env::var_os(\"USERPROFILE\").map(PathBuf::from).ok_or_else(|| \"USERPROFILE is unavailable\".to_string())?;`n  let root = home.join(\"Documents\").join(\"KDev\");`n  fs::create_dir_all(&root).map_err(|e| format!(\"cannot create KDev workspace: {e}\"))?;`n  Ok(root)`n}`n"
          if (-not $project.Contains($oldProject)) { throw 'Expected project_tools.rs root function was not found.' }
          $project = $project.Replace($oldProject, $newProject)
          Set-Content -NoNewline -Encoding utf8 src-tauri/src/project_tools.rs $project

          $git = Get-Content -Raw src-tauri/src/git.rs
          $oldGit = @'
fn root() -> Result<PathBuf, String> {
    std::env::current_exe().map_err(|e| e.to_string())?.parent().map(|p| p.to_path_buf()).ok_or_else(|| "cannot locate KDev root".into())
}
'@
          $newGit = "fn root() -> Result<PathBuf, String> {`n  let home = std::env::var_os(\"USERPROFILE\").map(PathBuf::from).ok_or_else(|| \"USERPROFILE is unavailable\".to_string())?;`n  let root = home.join(\"Documents\").join(\"KDev\");`n  fs::create_dir_all(&root).map_err(|e| format!(\"cannot create KDev workspace: {e}\"))?;`n  Ok(root)`n}`n"
          $git = $git.Replace('use std::{path::PathBuf, process::Command};', 'use std::{fs, path::PathBuf, process::Command};')
          if (-not $git.Contains($oldGit)) { throw 'Expected git.rs root function was not found.' }
          $git = $git.Replace($oldGit, $newGit)
          Set-Content -NoNewline -Encoding utf8 src-tauri/src/git.rs $git

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs src-tauri/src/project_tools.rs src-tauri/src/git.rs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix: store installed KDev workspace in user Documents'
            git push
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate release icon
        run: python tools/generate_icon.py

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installers
        run: npx tauri build --bundles nsis,msi

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "Tauri completed but no Windows NSIS .exe was produced." }
          if (-not $msi) { throw "Tauri completed but no Windows MSI was produced." }
          Write-Host "Windows EXE:"; $nsis | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Windows MSI:"; $msi | ForEach-Object { Write-Host $_.FullName }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          )
          foreach ($file in $files) {
            (Get-FileHash -Algorithm SHA256 $file.FullName).Hash + "  " + $file.Name | Set-Content -Encoding ascii ($file.FullName + ".sha256")
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: KDev-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sha256
          if-no-files-found: error
          retention-days: 14
