name: KDev Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate release icon
        run: python tools/generate_icon.py

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installers
        run: npx tauri build --bundles nsis,msi

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "Tauri completed but no Windows NSIS .exe was produced." }
          if (-not $msi) { throw "Tauri completed but no Windows MSI was produced." }
          Write-Host "Windows EXE:"; $nsis | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Windows MSI:"; $msi | ForEach-Object { Write-Host $_.FullName }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          )
          foreach ($file in $files) {
            (Get-FileHash -Algorithm SHA256 $file.FullName).Hash + "  " + $file.Name | Set-Content -Encoding ascii ($file.FullName + ".sha256")
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: KDev-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sha256
          if-no-files-found: error
          retention-days: 14
