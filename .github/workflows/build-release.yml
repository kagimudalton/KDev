name: KDev Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate release icon
        run: python tools/generate_icon.py

      - name: Install frontend dependencies
        run: npm install

      - name: Build KDev desktop bundle
        run: npm run tauri:build

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" }
          if (-not $files) { throw "No Windows release artifacts were produced." }
          foreach ($file in $files) {
            (Get-FileHash -Algorithm SHA256 $file.FullName).Hash + "  " + $file.Name | Set-Content -Encoding ascii ($file.FullName + ".sha256")
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: KDev-Windows-x64
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.sha256
          if-no-files-found: error
          retention-days: 14
