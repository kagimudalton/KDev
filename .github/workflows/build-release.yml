name: KDev Build Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate release icon
        run: python tools/generate_icon.py

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Build KDev bundled Windows runtime
        shell: pwsh
        run: |
          $runtime = "src-tauri/runtime/windows-x64"
          $bin = Join-Path $runtime "bin"
          $nodeGlobal = Join-Path $runtime "node-global"
          $gitRoot = Join-Path $runtime "git"
          $ruffRoot = Join-Path $runtime "ruff"
          $pythonRoot = Join-Path $runtime "python"
          $tmp = Join-Path $env:RUNNER_TEMP "kdev-runtime"

          Remove-Item $runtime -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $bin,$nodeGlobal,$gitRoot,$ruffRoot,$pythonRoot,$tmp | Out-Null

          # Build the managed Python runtime with uv instead of running the
          # CPython Windows MSI. The MSI returned exit code 1603 on the hosted
          # runner, while uv installs a relocatable python-build-standalone
          # distribution directly into the KDev bundle.
          $uvDir = Join-Path $tmp "uv"
          New-Item -ItemType Directory -Force -Path $uvDir | Out-Null
          $env:UV_UNMANAGED_INSTALL = $uvDir
          $uvInstaller = Join-Path $tmp "install-uv.ps1"
          Invoke-WebRequest -Uri "https://astral.sh/uv/install.ps1" -OutFile $uvInstaller
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uvInstaller
          $uv = Join-Path $uvDir "uv.exe"
          if (-not (Test-Path $uv)) { throw "uv installer did not produce uv.exe." }

          $env:UV_PYTHON_INSTALL_DIR = $pythonRoot
          & $uv python install 3.14.7 --install-dir $pythonRoot --force
          if ($LASTEXITCODE -ne 0) { throw "Managed Python download/install failed." }
          $pythonExe = Get-ChildItem -Path $pythonRoot -Recurse -Filter "python.exe" -File | Select-Object -First 1
          if (-not $pythonExe) { throw "Managed Python executable was not found after uv installation." }

          # Seed real pip into the managed interpreter so normal Python project
          # workflows remain available inside KDev without using host Python.
          & $uv pip install --python $pythonExe.FullName pip
          if ($LASTEXITCODE -ne 0) { throw "Managed pip installation failed." }
          $pythonHome = Split-Path $pythonExe.FullName -Parent
          Copy-Item (Join-Path $pythonHome "*") $bin -Recurse -Force

          # KDev-owned Node.js. npm and npx are included by Node.js itself.
          $nodeZip = Join-Path $tmp "node.zip"
          $nodeExtract = Join-Path $tmp "node"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.18.0/node-v22.18.0-win-x64.zip" -OutFile $nodeZip
          Expand-Archive -Path $nodeZip -DestinationPath $nodeExtract -Force
          $nodeRoot = Get-ChildItem $nodeExtract -Directory | Select-Object -First 1
          Copy-Item (Join-Path $nodeRoot.FullName "*") $bin -Recurse -Force

          # Git for Windows: keep the complete portable Git tree so git.exe
          # retains its DLLs and support files. MinGit is the small official
          # distribution intended for embedding/portable use.
          $gitApi = Invoke-RestMethod -Headers @{ "User-Agent" = "KDev-CI" } -Uri "https://api.github.com/repos/git-for-windows/git/releases/latest"
          $gitAsset = $gitApi.assets | Where-Object { $_.name -like "MinGit-*-64-bit.zip" } | Select-Object -First 1
          if (-not $gitAsset) { throw "Could not find the latest MinGit 64-bit asset." }
          $gitZip = Join-Path $tmp "mingit.zip"
          Invoke-WebRequest -Headers @{ "User-Agent" = "KDev-CI" } -Uri $gitAsset.browser_download_url -OutFile $gitZip
          Expand-Archive -Path $gitZip -DestinationPath $gitRoot -Force

          # Ruff is installed into a KDev-owned prefix, then its executable is
          # copied into the managed bin directory.
          & $uv pip install --python $pythonExe.FullName --target (Join-Path $ruffRoot "site") ruff
          if ($LASTEXITCODE -ne 0) { throw "Bundled Ruff installation failed." }
          $ruffExe = Get-ChildItem -Path $ruffRoot -Recurse -Filter "ruff.exe" -File | Select-Object -First 1
          if (-not $ruffExe) { throw "Bundled Ruff executable was not produced." }
          Copy-Item $ruffExe.FullName (Join-Path $bin "ruff.exe") -Force

          # Prettier + tsx are installed into KDev's private Node prefix.
          $env:Path = "$bin;$(Join-Path $nodeGlobal 'node_modules/.bin');$env:Path"
          & (Join-Path $bin "npm.cmd") install --prefix $nodeGlobal --no-save prettier@3.6.2 tsx@4.20.3
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node tooling installation failed." }

          # Self-tests: every execution dependency used by KDev must exist in
          # the bundle before Tauri packages it.
          & (Join-Path $bin "python.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Python failed its self-test." }
          & (Join-Path $bin "python.exe") -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled pip failed its self-test." }
          & (Join-Path $bin "node.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node.js failed its self-test." }
          & (Join-Path $bin "npm.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled npm failed its self-test." }
          & (Join-Path $gitRoot "cmd/git.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Git failed its self-test." }
          & (Join-Path $bin "ruff.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Ruff failed its self-test." }
          & (Join-Path $nodeGlobal "node_modules/.bin/prettier.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Prettier failed its self-test." }
          & (Join-Path $nodeGlobal "node_modules/.bin/tsx.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled tsx failed its self-test." }

          Write-Host "Managed KDev runtime contents:"
          Get-ChildItem -Recurse $runtime | Select-Object -First 200 FullName

      - name: Build Windows installers
        run: npx tauri build --bundles nsis,msi

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          if (-not $nsis) { throw "Tauri completed but no Windows NSIS .exe was produced." }
          if (-not $msi) { throw "Tauri completed but no Windows MSI was produced." }
          Write-Host "Windows EXE:"; $nsis | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Windows MSI:"; $msi | ForEach-Object { Write-Host $_.FullName }

      - name: Verify embedded Windows compatibility manifest
        shell: pwsh
        run: |
          $exeCandidates = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'build-script|deps' }
          if (-not $exeCandidates) { throw "Could not locate the built KDev.exe to verify its manifest." }
          $exePath = $exeCandidates[0].FullName
          $mt = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "mt.exe" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($mt) {
            $manifestOut = Join-Path $env:RUNNER_TEMP "kdev-manifest.xml"
            & $mt.FullName -inputresource:"$exePath;#1" -out:"$manifestOut" | Out-Null
            $manifestText = Get-Content -Raw $manifestOut
            if ($manifestText -notmatch [regex]::Escape('8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a')) { throw "Built executable is missing the Windows 10/11 supportedOS GUID in its manifest." }
            if ($manifestText -notmatch 'asInvoker') { throw "Built executable manifest does not declare asInvoker execution level." }
          } else { Write-Warning "mt.exe was not found; skipping direct manifest extraction." }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          )
          foreach ($file in $files) {
            (Get-FileHash -Algorithm SHA256 $file.FullName).Hash + "  " + $file.Name | Set-Content -Encoding ascii ($file.FullName + ".sha256")
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: KDev-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sha256
          if-no-files-found: error
          retention-days: 14
