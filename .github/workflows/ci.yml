name: KDev CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for build assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate build icon
        run: python tools/generate_icon.py

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
